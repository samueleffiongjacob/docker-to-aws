# Step 2: ship a specific image tag.
#   ansible-playbook deploy.yml -e image_tag=<git-sha>
- name: Deploy application
  hosts: production
  tags: [deploy]

  tasks:
    - name: Require an image tag (the commit SHA built by CI)
      ansible.builtin.assert:
        that: image_tag is defined and image_tag | length > 0
        fail_msg: "Pass -e image_tag=<git sha>"

    - name: Require every setting that comes from GitHub secrets
      ansible.builtin.assert:
        that:
          - image_repo | length > 0
          - postgres_user | length > 0
          - postgres_password | length > 0
          - postgres_db | length > 0
          - cors_origins | length > 0
          - ghcr_user | length > 0
          - ghcr_token | length > 0
          - "\"'\" not in postgres_password"
        fail_msg: >-
          A required value is empty (or POSTGRES_PASSWORD contains a single quote).
          Check the repo secrets: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
          CORS_ORIGINS, and that IMAGE_REPO / GHCR_USER / GHCR_TOKEN reach the step.
        quiet: true

    - name: Check Docker and Compose v2 are usable by this user
      ansible.builtin.shell: docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Stop with a clear message if the host isn't ready
      ansible.builtin.assert:
        that: docker_check.rc == 0
        fail_msg: >-
          Docker (or the Compose v2 plugin) is missing, or {{ ansible_user }} is not in the
          docker group. Run provision.yml once, then deploy again.
        quiet: true

    - name: Make sure the app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0750"

    - name: Read the previously deployed tag (for rollback)
      ansible.builtin.slurp:
        src: "{{ app_dir }}/.deployed_tag"
      register: previous_tag_file
      failed_when: false

    - name: Remember the previous tag
      ansible.builtin.set_fact:
        previous_tag: "{{ (previous_tag_file.content | b64decode | trim) if previous_tag_file.content is defined else '' }}"

    - name: Upload compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/docker-compose.prod.yml"
        dest: "{{ app_dir }}/docker-compose.prod.yml"
        mode: "0644"

    - name: Release
      block:
        - name: Apply the new release
          ansible.builtin.include_tasks: tasks/apply.yml
          vars:
            release_tag: "{{ image_tag }}"

        - name: Verify the release
          ansible.builtin.include_tasks: tasks/verify.yml

        - name: Record the deployed tag
          ansible.builtin.copy:
            content: "{{ image_tag }}\n"
            dest: "{{ app_dir }}/.deployed_tag"
            mode: "0644"

        - name: Remove dangling images
          ansible.builtin.command: docker image prune -f
          changed_when: false

      rescue:
        - name: Capture recent container logs
          ansible.builtin.command: docker compose -f docker-compose.prod.yml logs --no-color --tail=120
          args:
            chdir: "{{ app_dir }}"
          register: failure_logs
          changed_when: false
          failed_when: false

        - name: Show the logs
          ansible.builtin.debug:
            msg: "{{ failure_logs.stdout_lines | default([]) }}"

        - name: Roll back to the previous release
          ansible.builtin.include_tasks: tasks/apply.yml
          vars:
            release_tag: "{{ previous_tag }}"
          when: previous_tag | length > 0

        - name: Fail the deploy
          ansible.builtin.fail:
            msg: >-
              Deploy of {{ image_tag }} failed.
              {{ ('Rolled back to ' ~ previous_tag) if previous_tag | length > 0 else 'No previous release to roll back to.' }}
