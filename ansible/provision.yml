# Step 1: prepare the EC2 box (idempotent - safe to run every time).
- name: Provision EC2 host
  hosts: production
  become: true
  tags: [provision]

  vars:
    deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that: ansible_distribution == 'Ubuntu'
        fail_msg: This playbook targets Ubuntu EC2 images.

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, jq]
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120

    - name: Add Docker's GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true
        lock_timeout: 120

    - name: Configure Docker log rotation
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the deploy user run docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"

    # New group membership only applies to new SSH sessions.
    - name: Reconnect so the docker group applies
      ansible.builtin.meta: reset_connection

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
