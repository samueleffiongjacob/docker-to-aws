# Step 1: prepare the EC2 box (idempotent - safe to run every time).
- name: Provision EC2 host
  hosts: production
  become: true
  tags: [provision]

  vars:
    deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that: ansible_distribution == 'Ubuntu'
        fail_msg: This playbook targets Ubuntu EC2 images.

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, jq, python3-debian]
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120

    # A Docker repo added by hand or by an older playbook (docker.list) would clash
    # with the one below and make `apt update` fail on conflicting Signed-By values.
    - name: Remove any legacy Docker apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
    
    #apt_repository is deprecated and ansible-core will remove it. I switched to deb822_repository, and added python3-debian to the prerequisites because that module needs it.

    # - name: Add Docker's GPG key
    #   ansible.builtin.get_url:
    #     url: https://download.docker.com/linux/ubuntu/gpg
    #     dest: /etc/apt/keyrings/docker.asc
    #     mode: "0644"

    # - name: Add Docker apt repository
    #   ansible.builtin.apt_repository:
    #     repo: >-
    #       deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
    #       https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    #     filename: docker

    # switch to deb822_repository, and added python3-debian
    - name: Add Docker apt repository (key fetched and pinned to this repo only)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: ["{{ deb_arch }}"]
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true
        lock_timeout: 120

    - name: Configure Docker log rotation
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the deploy user run docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"

    # New group membership only applies to new SSH sessions.
    - name: Reconnect so the docker group applies
      ansible.builtin.meta: reset_connection

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
