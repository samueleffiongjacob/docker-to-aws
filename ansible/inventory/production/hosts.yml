all:
  children:
    production:
      hosts:
        ec2-prod:
          # Same values as the EC2_HOST / EC2_USERNAME / EC2_PORT / EC2_SSH_KEY secrets.
          ansible_host: "{{ lookup('env', 'EC2_HOST') | default('REPLACE_WITH_EC2_IP', true) }}"
          ansible_user: "{{ lookup('env', 'EC2_USERNAME') | default('ubuntu', true) }}"
          ansible_port: "{{ lookup('env', 'EC2_PORT') | default('22', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'EC2_SSH_KEY_FILE') | default('~/.ssh/ec2-prod.pem', true) }}"
