# ---- Non-secret production settings (mirrors env: / vars: in deploy.yaml) ----
app_dir: /home/ubuntu/app          # EC2_TARGET_DIR
registry: ghcr.io
image_repo: owner/repo             # lowercase "owner/repo" of your GitHub repository

postgres_host_port: 5433
backend_host_port: 8000
frontend_host_port: 3000
cors_origins: "http://localhost:3000"   # GitHub variable CORS_ORIGINS
log_level: INFO

# ---- Secrets come from vault.yml (encrypted) ----
postgres_user: "{{ vault_postgres_user }}"
postgres_password: "{{ vault_postgres_password }}"
postgres_db: "{{ vault_postgres_db }}"
ghcr_user: "{{ vault_ghcr_user }}"
ghcr_token: "{{ vault_ghcr_token }}"   # PAT with read:packages (GITHUB_TOKEN dies after the run)

# ---- Derived: image_tag is passed at run time (-e image_tag=<sha>) ----
backend_image: "{{ registry }}/{{ image_repo }}/backend"
frontend_image: "{{ registry }}/{{ image_repo }}/frontend"
