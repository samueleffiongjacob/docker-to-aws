# Everything is read from environment variables, which GitHub Actions fills from
# repo secrets. Nothing sensitive or environment-specific is stored in this repo.
# To run by hand, export the same variable names first.

app_dir: "{{ lookup('env', 'APP_DIR') | default('/home/ubuntu/app', true) }}"
registry: ghcr.io
image_repo: "{{ lookup('env', 'IMAGE_REPO') }}"          # lowercase owner/repo

postgres_user: "{{ lookup('env', 'POSTGRES_USER') }}"
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
postgres_db: "{{ lookup('env', 'POSTGRES_DB') }}"
cors_origins: "{{ lookup('env', 'CORS_ORIGINS') }}"

ghcr_user: "{{ lookup('env', 'GHCR_USER') }}"
ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

# Optional overrides (defaults match your old workflow)
postgres_host_port: "{{ lookup('env', 'POSTGRES_HOST_PORT') | default('5433', true) }}"
backend_host_port: "{{ lookup('env', 'BACKEND_HOST_PORT') | default('8000', true) }}"
frontend_host_port: "{{ lookup('env', 'FRONTEND_HOST_PORT') | default('3000', true) }}"
log_level: "{{ lookup('env', 'LOG_LEVEL') | default('INFO', true) }}"

backend_image: "{{ registry }}/{{ image_repo }}/backend"
frontend_image: "{{ registry }}/{{ image_repo }}/frontend"
