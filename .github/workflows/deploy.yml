name: Deploy to EC2

# Every push to main ships; workflow_dispatch re-runs the same deploy by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only ever one deploy in flight. Not cancel-in-progress: killing a half-applied
# rollout on the box is worse than letting it finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# packages: write is what lets GITHUB_TOKEN push images to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    
    # Image refs are computed once here and consumed by the deploy job below.
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image references
        id: images
        run: |
          # GHCR requires a lowercase path; the owner/repo casing is not guaranteed.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${repo}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${repo}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"


      # Buildx is required for the type=gha layer cache used by the build steps.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Immutable :sha tag is what the host deploys; :latest is a convenience
          # pointer for humans pulling by hand.
          tags: |
            ${{ steps.images.outputs.backend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    
    # Production environment scopes the deploy secrets and any required approval.
    environment: production

    steps:
      # Needed for the ansible/ project and the deploy/ compose file it uploads.
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets pasted into the GitHub UI routinely pick up trailing newlines,
      # which silently corrupt every path and host built from them. Strip them
      # once here rather than debugging "$'/home/ubuntu/app\n\n\n'" later.
      # Strip stray newlines/whitespace that creep into pasted secrets.
      - name: Resolve deploy inputs
        id: cfg
        env:
          RAW_DIR: ${{ secrets.EC2_TARGET_DIR }}
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USERNAME }}
          RAW_PORT: ${{ secrets.EC2_PORT }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          dir="$(clean "$RAW_DIR")"
          {
            echo "dir=${dir:-/home/ubuntu/app}"
            echo "host=$(clean "$RAW_HOST")"
            echo "user=$(clean "$RAW_USER")"
            echo "port=$(clean "$RAW_PORT")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          pipx install "ansible-core>=2.16,<2.20"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible deploy
        working-directory: ansible
        env:
          EC2_HOST: ${{ steps.cfg.outputs.host }}
          EC2_USERNAME: ${{ steps.cfg.outputs.user }}
          EC2_PORT: ${{ steps.cfg.outputs.port }}
          EC2_SSH_KEY_FILE: ${{ runner.temp }}/key.pem
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Secrets travel as env vars, never interpolated into the script body.
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          APP_DIR: ${{ steps.cfg.outputs.dir }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          # Registry login: built-in token by default; add GHCR_USERNAME + GHCR_PAT
          # secrets only if you want a long-lived token that works outside Actions.
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$EC2_SSH_KEY_FILE"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$EC2_SSH_KEY_FILE"

          # Same lowercase owner/repo that the build job pushed to.
          export IMAGE_REPO="${GITHUB_REPOSITORY,,}"

          # JSON extra-vars keep values with spaces/commas (CORS_ORIGINS) intact.
          extra="$(jq -nc \
            --arg tag "$GITHUB_SHA" \
            --arg IMAGE_REPO "$IMAGE_REPO" \
            --arg dir "$APP_DIR" \
            --arg cors "$CORS_ORIGINS" \
            '{image_tag: $tag, image_repo: $repo, app_dir: $dir}
             + (if $cors != "" then {cors_origins: $cors} else {} end)')"

          ansible-playbook deploy.yml -e "$extra" --vault-password-file "$VAULT_FILE"

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "| Service | Image |"
            echo "| --- | --- |"
            echo "| backend | \`${{ needs.build.outputs.backend_image }}\` |"
            echo "| frontend | \`${{ needs.build.outputs.frontend_image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"