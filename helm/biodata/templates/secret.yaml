{{- $name := include "biodata.fullname" . -}}
{{- $user := required "auth.username is required" .Values.auth.username -}}
{{- $pass := required "auth.password is required (pass it in a values file, never commit it)" .Values.auth.password -}}
{{- $db := required "auth.database is required" .Values.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-auth
  labels:
    {{- include "biodata.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ $user | b64enc }}
  POSTGRES_PASSWORD: {{ $pass | b64enc }}
  POSTGRES_DB: {{ $db | b64enc }}
  # Credentials inside a URL must be percent-encoded. urlquery turns a space into
  # "+", which in a URL would mean a literal plus, so it is swapped for %20.
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-db:5432/%s" (urlquery $user | replace "+" "%20") (urlquery $pass | replace "+" "%20") $name $db | b64enc }}
