apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "biodata.fullname" . }}-config
  labels:
    {{- include "biodata.labels" . | nindent 4 }}
data:
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # The frontend reaches the backend through the backend Service. In-cluster clients must use
  # the Service's own port (backend.service.port), not the container port behind it.
  BACKEND_URL: {{ printf "http://%s-backend:%v" (include "biodata.fullname" .) .Values.backend.service.port | quote }}