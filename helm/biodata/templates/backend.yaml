{{- $name := include "biodata.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-backend
  labels:
    {{- include "biodata.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "biodata.selector" (dict "root" . "component" "backend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-backend
  labels:
    {{- include "biodata.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "biodata.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "biodata.selector" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "biodata.pullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ $name }}-auth, key: POSTGRES_USER } }
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h {{ $name }}-db -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for database"; sleep 2
              done
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          # Same as the compose files: migrate, then serve. `args` (not `command`)
          # mirrors compose's `command:`, which replaces the image's CMD.
          args:
            - sh
            - -c
            - uv run alembic upgrade head && uv run python -m biodata
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $name }}-auth, key: DATABASE_URL } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: {{ $name }}-config, key: CORS_ORIGINS } }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: {{ $name }}-config, key: LOG_LEVEL } }
          # Migrations run before the server starts, so allow up to 3 minutes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
